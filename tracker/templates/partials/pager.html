{% if page.has_other_pages %}
<div class="flex items-center justify-between mt-6 font-mono text-xs text-neutral-600">
    <span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
    <div class="flex gap-3">
        {% if page.has_previous %}<a href="?{{ extra_qs }}page={{ page.previous_page_number }}" class="px-4 py-2 border border-black/15 hover:border-black/50 hover:text-black transition-all">Previous</a>{% endif %}
        {% if page.has_next %}<a href="?{{ extra_qs }}page={{ page.next_page_number }}" class="px-4 py-2 border border-black/15 hover:border-black/50 hover:text-black transition-all">Next</a>{% endif %}
    </div>
</div>
{% endif %}
